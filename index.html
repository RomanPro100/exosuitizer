<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c4c4c4" />
    <title>Exosuitizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>Exosuitizer</h1>
        <div id="credits" class="credits">
          <a href="https://t.me/mej1ch">by mej1ch</a>
          <a href="https://github.com/RomanPro100">forked by RomanPro100</a>
        </div>
      </header>

      <section class="workspace" aria-label="Редактор изображения">
        <div class="editor-column">
          <div id="side-selector" class="side-selector">
            <div></div>
            <button class="button" id="side-top">+</button>
            <div></div>
            <button class="button" id="side-left">+</button>
            <div id="dropzone" class="preview-card dropzone" tabindex="0" aria-label="Загрузить изображение">
              <div id="result-placeholder" class="placeholder">
                Нажмите, чтобы выбрать файл,<br />или перетащите файл сюда
              </div>
              <canvas id="result-canvas" hidden></canvas>
              <img id="result-preview" alt="Обработанное изображение" hidden />
            </div>
            <button class="button" id="side-right">+</button>
            <div></div>
            <button class="button" id="side-bottom">+</button>
            <div></div>
          </div>
          <input
            id="file-input"
            type="file"
            accept=".jpg,.jpeg,.png,.webp,.bmp,image/jpeg,image/png,image/webp,image/bmp"
            hidden
          />
          <div class="download-row">
            <select id="format-select" aria-label="Формат результата">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
              <option value="bmp">BMP</option>
            </select>
            <button id="download-button" class="button" type="button" disabled>Скачать результат</button>
          </div>
        </div>
      </section>

      <p id="error-message" class="error-message" aria-live="polite"></p>
      <!--<div class="author-callout" aria-hidden="true">
        <svg class="author-arrow" viewBox="0 0 760 180" preserveAspectRatio="none">
          <path d="M 30 90 H 660 M 660 90 L 570 25 M 660 90 L 570 155" />
        </svg>
      </div>-->
      <footer></footer>
    </main>
    <script src="app.js"></script>
    <!--<script src="drawArrows.js"></script>-->
  </body>
</html>
