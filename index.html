<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c4c4c4">
  <title>Exosuitizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Exosuitizer</h1>
      <p>Добавьте синюю полосу к изображению</p>
    </header>

    <section class="segment-bar" aria-label="Сторона полосы">
      <label class="segment-option">
        <input type="radio" name="side" value="bottom" checked>
        <span>Снизу</span>
      </label>
      <label class="segment-option">
        <input type="radio" name="side" value="right">
        <span>Справа</span>
      </label>
      <label class="segment-option">
        <input type="radio" name="side" value="left">
        <span>Слева</span>
      </label>
      <label class="segment-option">
        <input type="radio" name="side" value="top">
        <span>Сверху</span>
      </label>
    </section>

    <section class="workspace" aria-label="Редактор изображения">
      <div class="editor-column">
        <div id="dropzone" class="preview-card dropzone" tabindex="0" role="button" aria-label="Загрузить изображение">
          <div id="input-placeholder" class="placeholder">Перетащите файл сюда<br>или выберите его кнопкой ниже</div>
          <img id="source-preview" alt="Исходное изображение" hidden>
          <canvas id="source-canvas" hidden></canvas>
        </div>
        <button id="choose-button" class="button" type="button">Загрузить фото...</button>
        <input id="file-input" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,image/jpeg,image/png,image/webp,image/bmp" hidden>
      </div>

      <div class="action-column">
        <button id="process-button" class="button accent" type="button" disabled>ЭКСАУТИЗИРОВАТЬ</button>
      </div>

      <div class="editor-column">
        <div class="preview-card result-card">
          <div id="result-placeholder" class="placeholder">Результат</div>
          <img id="result-preview" alt="Обработанное изображение" hidden>
          <canvas id="result-canvas" hidden></canvas>
        </div>
        <div class="download-row">
          <select id="format-select" aria-label="Формат результата">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WebP</option>
            <option value="bmp">BMP</option>
          </select>
          <button id="download-button" class="button" type="button" disabled>Скачать результат</button>
        </div>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="author-callout" aria-hidden="true">
      <svg class="author-arrow" viewBox="0 0 760 180" preserveAspectRatio="none">
        <path d="M 30 90 H 660 M 660 90 L 570 25 M 660 90 L 570 155" />
      </svg>
    </div>
    <footer><a href="https://t.me/mej1ch">by mej1ch</a></footer>
  </main>
  <script src="app.js"></script>
  <script>
  (function() {
    // Remove old overlay if present
    const old = document.getElementById("schizo-arrows-overlay");
    if (old) old.remove();

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.id = "schizo-arrows-overlay";

    // Ensure body can anchor an absolute overlay without horizontal scrollbars
    document.body.style.position = "relative";
    document.documentElement.style.overflowX = "hidden";
    document.body.style.overflowX = "hidden";

    Object.assign(svg.style, {
      position: "absolute",
      top: "0",
      left: "0",
      width: "100%",
      pointerEvents: "none",
      zIndex: "9999",
      overflow: "hidden"
    });
    document.body.appendChild(svg);

    function findCreditElement() {
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        if (walker.currentNode.nodeValue.trim().toLowerCase().includes("mej1ch")) {
          return walker.currentNode.parentElement;
        }
      }
      return document.querySelector("footer");
    }

    function drawArrows() {
      const W = document.documentElement.clientWidth || window.innerWidth;
      const H = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        window.innerHeight
      );

      svg.style.height = H + "px";
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      const isMobile = W < 768;
      const target = findCreditElement();

      // Default fallback coordinates
      let tx = isMobile ? W * 0.78 : W * 0.703;
      let ty = H - (isMobile ? 28 : 35);

      if (target) {
        const rect = target.getBoundingClientRect();
        tx = rect.left + window.scrollX + rect.width / 2;
        ty = rect.top + window.scrollY + rect.height / 2;
      }

      const rx = isMobile ? 48 : 75;
      const ry = isMobile ? 24 : 42;
      const sw = isMobile ? 2.2 : 3.2;

      if (isMobile) {
        // MOBILE LAYOUT: Hugs the outer edges, stays below the download buttons, scales to 375px width
        const blueY = ty - 32;
        const blueStartX = Math.max(16, tx - rx - 180);
        const blueEndX = tx - rx - 6;

        svg.innerHTML = `
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- Red scribbled circle around "by mej1ch" -->
            <path d="M ${tx - rx} ${ty + 3}
                     C ${tx - rx - 6} ${ty - ry - 6}, ${tx + rx + 8} ${ty - ry - 4}, ${tx + rx} ${ty}
                     C ${tx + rx + 4} ${ty + ry + 6}, ${tx - rx - 4} ${ty + ry + 5}, ${tx - rx + 6} ${ty - 5}
                     C ${tx - rx + 14} ${ty - ry - 7}, ${tx + rx - 4} ${ty - ry + 5}, ${tx + rx - 5} ${ty + 4}"
                  stroke="#e60000" stroke-width="${sw}" />

            <!-- Bottom straight blue arrow -->
            <path d="M ${blueStartX} ${blueY} L ${blueEndX} ${blueY}"
                  stroke="#0000ff" stroke-width="5" />
            <path d="M ${blueEndX - 22} ${blueY - 14} L ${blueEndX + 2} ${blueY} L ${blueEndX - 22} ${blueY + 14}"
                  stroke="#0000ff" stroke-width="5" />

            <!-- Left red arrow: runs down the far left margin and curves under the buttons -->
            <path d="M 14 ${H * 0.25}
                     C 4 ${H * 0.72}, 10 ${ty - 75}, ${W * 0.38} ${ty - 62}
                     C ${W * 0.55} ${ty - 55}, ${tx - 24} ${ty - 55}, ${tx - 10} ${ty - ry - 4}"
                  stroke="#e60000" stroke-width="${sw}" />
            <path d="M 10 ${H * 0.32}
                     C 6 ${H * 0.74}, 14 ${ty - 70}, ${W * 0.40} ${ty - 58}
                     C ${W * 0.56} ${ty - 52}, ${tx - 18} ${ty - 50}, ${tx - 6} ${ty - ry - 2}"
                  stroke="#e60000" stroke-width="${sw * 0.85}" />
            <!-- Left arrow head -->
            <path d="M ${tx - 28} ${ty - ry - 38} L ${tx - 8} ${ty - ry - 2} L ${tx + 6} ${ty - ry - 42}
                     M ${tx - 23} ${ty - ry - 32} L ${tx - 6} ${ty - ry - 4} L ${tx + 2} ${ty - ry - 35}"
                  stroke="#e60000" stroke-width="${sw}" />

            <!-- Right red arrow: hugs right margin without clipping off-screen -->
            <path d="M ${W - 8} ${H * 0.18}
                     C ${W - 4} ${H * 0.55}, ${W - 12} ${ty - 120}, ${tx + 18} ${ty - ry - 12}
                     M ${W - 12} ${H * 0.22}
                     C ${W - 8} ${H * 0.57}, ${W - 16} ${ty - 115}, ${tx + 22} ${ty - ry - 10}"
                  stroke="#e60000" stroke-width="${sw}" />
            <!-- Right arrow head -->
            <path d="M ${tx + 8} ${ty - ry - 68} L ${tx + 18} ${ty - ry - 10} L ${ Math.min(W - 6, tx + 62) } ${ty - ry - 16}
                     M ${tx + 12} ${ty - ry - 58} L ${tx + 21} ${ty - ry - 12} L ${ Math.min(W - 10, tx + 54) } ${ty - ry - 20}"
                  stroke="#e60000" stroke-width="${sw}" />
          </g>
        `;
      } else {
        // DESKTOP LAYOUT
        svg.innerHTML = `
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M ${tx - rx} ${ty + 5}
                     C ${tx - rx - 10} ${ty - ry - 10}, ${tx + rx + 15} ${ty - ry - 5}, ${tx + rx} ${ty}
                     C ${tx + rx + 5} ${ty + ry + 10}, ${tx - rx - 5} ${ty + ry + 8}, ${tx - rx + 10} ${ty - 8}
                     C ${tx - rx + 25} ${ty - ry - 12}, ${tx + rx - 5} ${ty - ry + 8}, ${tx + rx - 8} ${ty + 6}"
                  stroke="#e60000" stroke-width="3.5" />

            <path d="M ${ Math.max(80, tx - 420) } ${ty - 50} L ${tx - rx + 12} ${ty - 50}"
                  stroke="#0000ff" stroke-width="8" />
            <path d="M ${tx - rx - 45} ${ty - 80} L ${tx - rx + 15} ${ty - 50} L ${tx - rx - 45} ${ty - 18}"
                  stroke="#0000ff" stroke-width="8" />

            <path d="M ${W * 0.135} ${H * 0.27}
                     C ${W * 0.08} ${H * 0.82}, ${W * 0.28} ${H * 0.76}, ${W * 0.48} ${H * 0.70}
                     C ${W * 0.61} ${H * 0.67}, ${tx - 35} ${ty - 130}, ${tx - 15} ${ty - ry - 6}"
                  stroke="#e60000" stroke-width="3" />
            <path d="M ${W * 0.125} ${H * 0.40}
                     C ${W * 0.095} ${H * 0.80}, ${W * 0.29} ${H * 0.74}, ${W * 0.49} ${H * 0.69}
                     C ${W * 0.62} ${H * 0.66}, ${tx - 25} ${ty - 120}, ${tx - 10} ${ty - ry - 4}"
                  stroke="#e60000" stroke-width="2.5" />
            <path d="M ${W * 0.132} ${H * 0.34}
                     C ${W * 0.09} ${H * 0.84}, ${W * 0.27} ${H * 0.78}, ${W * 0.47} ${H * 0.72}
                     C ${W * 0.60} ${H * 0.69}, ${tx - 30} ${ty - 125}, ${tx - 12} ${ty - ry - 2}"
                  stroke="#e60000" stroke-width="2.5" />
            <path d="M ${tx - 58} ${ty - ry - 95} L ${tx - 12} ${ty - ry - 2} L ${tx + 12} ${ty - ry - 105}
                     M ${tx - 48} ${ty - ry - 85} L ${tx - 10} ${ty - ry - 5} L ${tx + 4} ${ty - ry - 90}"
                  stroke="#e60000" stroke-width="3" />

            <path d="M ${W * 0.925} ${H * 0.12}
                     C ${W * 0.88} ${H * 0.45}, ${W * 0.82} ${H * 0.63}, ${tx + 42} ${ty - ry - 30}
                     M ${W * 0.925} ${H * 0.12}
                     C ${W * 0.905} ${H * 0.48}, ${W * 0.85} ${H * 0.65}, ${tx + 46} ${ty - ry - 28}
                     M ${W * 0.915} ${H * 0.18}
                     C ${W * 0.87} ${H * 0.47}, ${W * 0.81} ${H * 0.62}, ${tx + 38} ${ty - ry - 32}"
                  stroke="#e60000" stroke-width="3" />
            <path d="M ${tx + 95} ${ty - ry - 210} L ${tx + 38} ${ty - ry - 28} L ${tx + 185} ${ty - ry - 28}
                     M ${tx + 82} ${ty - ry - 185} L ${tx + 44} ${ty - ry - 32} L ${tx + 165} ${ty - ry - 35}"
                  stroke="#e60000" stroke-width="3.5" />
          </g>
        `;
      }
    }

    window.addEventListener("load", drawArrows);
    window.addEventListener("resize", drawArrows);
    // Redraw if images load or layout shifts
    const ro = new ResizeObserver(drawArrows);
    ro.observe(document.body);
    drawArrows();
  })();
  </script>
</body>
</html>
